# Docker Compose v2+ (no version attribute needed)
# COMPOSE_BAKE=true enables buildx bake for better performance

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modca_backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - COMPOSE_BAKE=true
    # Mount persistent host directory for SQLite DB
    volumes:
      - ./backend/sqlite_data/settings.db:/home/modcauser/app/settings.db
    expose:
      - "8000"
    networks:
      - modca_net

  nginx:
    image: nginx:1.25-alpine
    container_name: modca_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/config/nginx/modca.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - modca_net

# Remove Docker-managed volume, use host directory instead
# volumes:
#   modca_sqlite_data:
#     driver: local

networks:
  modca_net:
    driver: bridge
