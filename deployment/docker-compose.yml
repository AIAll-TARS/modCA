services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: modca_backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../backend/sqlite_data:/app/sqlite_data
    expose:
      - "8000"
    networks:
      - modca_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: modca_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt/live/ws.janis7ewski.org/fullchain.pem:/etc/letsencrypt/live/ws.janis7ewski.org/fullchain.pem:ro
      - /etc/letsencrypt/live/ws.janis7ewski.org/privkey.pem:/etc/letsencrypt/live/ws.janis7ewski.org/privkey.pem:ro
    depends_on:
      - backend
    networks:
      - modca_net

networks:
  modca_net:
    driver: bridge



    
